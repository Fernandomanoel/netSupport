<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AulaCerta — Teste</title>
<style>
  :root{
    --bg:#070c18; --surface:#0f1a30; --surface-2:#13223c; --line:#1d2d4d; --line-strong:#273b63;
    --ink:#eaf0fb; --muted:#9fb0cf; --faint:#5e7199; --red:#e23140; --red-bright:#ff4d5e; --red-deep:#8f1420; --azure:#4f9bff;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; font:15px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:radial-gradient(900px 540px at 50% -10%, #0d1830, transparent 60%), var(--bg); }
  ::selection{ background:var(--red); color:#fff; }
  header{ position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px; padding:16px 22px;
    background:linear-gradient(180deg, rgba(8,13,26,.95), rgba(8,13,26,.78)); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .mark{ width:30px; height:30px; border-radius:8px; display:grid; place-items:center; background:linear-gradient(145deg,var(--red),var(--red-deep)); box-shadow:inset 0 1px 0 rgba(255,255,255,.22); }
  .mark svg{ width:17px; height:17px; }
  header h1{ margin:0; font-size:15px; font-weight:650; letter-spacing:-.01em; }
  header .tn{ color:var(--muted); font-size:13px; margin-left:auto; }
  main{ padding:22px; max-width:680px; margin:0 auto; }
  .q{ background:linear-gradient(180deg,var(--surface-2),var(--surface)); border:1px solid var(--line); border-radius:13px; padding:17px 18px; margin-bottom:14px; }
  .q .num{ font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--azure); }
  .q .enun{ font-size:16px; font-weight:600; letter-spacing:-.01em; margin:7px 0 13px; }
  .op{ display:flex; align-items:center; gap:11px; padding:11px 13px; border:1px solid var(--line-strong); border-radius:10px; margin-bottom:9px; cursor:pointer; transition:border-color .13s, background .13s; }
  .op:hover{ border-color:#355089; }
  .op:has(input:checked){ border-color:var(--red); background:rgba(226,49,64,.08); }
  .op input{ accent-color:var(--red); width:17px; height:17px; flex:none; }
  textarea{ width:100%; min-height:92px; resize:vertical; font:14.5px "Segoe UI",system-ui,sans-serif; color:var(--ink); background:var(--bg); border:1px solid var(--line-strong); border-radius:10px; padding:11px 13px; }
  textarea:focus{ outline:none; border-color:var(--azure); box-shadow:0 0 0 3px rgba(79,155,255,.18); }
  .rodape{ position:sticky; bottom:0; display:flex; align-items:center; gap:14px; padding:16px 22px; background:linear-gradient(0deg, rgba(8,13,26,.96), rgba(8,13,26,.7)); border-top:1px solid var(--line); }
  .enviar{ font:15px/1 "Segoe UI",system-ui,sans-serif; font-weight:650; cursor:pointer; padding:12px 22px; border-radius:10px; border:1px solid var(--red-deep); background:linear-gradient(180deg,#c41d2b,var(--red-deep)); color:#fff; }
  .enviar:disabled{ opacity:.5; cursor:default; }
  .dica{ color:var(--muted); font-size:13px; }
  /* Confirmacao */
  .feito{ display:none; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; min-height:70vh; padding:30px; }
  .feito.show{ display:flex; }
  .feito .check{ width:66px; height:66px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle, rgba(79,155,255,.2), transparent 70%); }
  .feito .check svg{ width:38px; height:38px; color:var(--azure); }
  .feito h2{ margin:0; font-size:21px; font-weight:700; letter-spacing:-.02em; }
  .feito p{ margin:0; color:var(--muted); max-width:360px; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important; } }
</style>
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 6.5 12 3l9 3.5-9 3.5-9-3.5Z" fill="#fff" fill-opacity=".95"/><path d="M7 11.2V15c0 1.7 2.24 3 5 3s5-1.3 5-3v-3.8" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-opacity=".85"/></svg></span>
    <h1>Teste</h1>
    <span class="tn" id="tn"></span>
  </header>

  <div id="prova">
    <main id="questoes"></main>
    <div class="rodape">
      <button class="enviar" id="enviar">Enviar respostas</button>
      <span class="dica" id="dica"></span>
    </div>
  </div>

  <div class="feito" id="feito">
    <div class="check"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2>Respostas enviadas</h2>
    <p>Aguarde o professor encerrar o teste. Você pode deixar esta janela aberta.</p>
  </div>

<script>
  let teste = null;
  const elQ = document.getElementById("questoes");
  const btn = document.getElementById("enviar");
  const dica = document.getElementById("dica");

  window.aulacerta.onTeste((t) => { teste = t; render(); });

  function render(){
    document.getElementById("tn").textContent = teste.nome || "";
    elQ.innerHTML = "";
    teste.questoes.forEach((q, i) => {
      const div = document.createElement("div");
      div.className = "q";
      const head = `<div class="num">Questão ${i+1}</div><div class="enun"></div>`;
      if (q.tipo === "objetiva"){
        const ops = (q.opcoes || []).map((op, oi) =>
          `<label class="op"><input type="radio" name="q${i}" value="${oi}"><span></span></label>`).join("");
        div.innerHTML = head + ops;
        div.querySelectorAll(".op span").forEach((s, oi) => s.textContent = q.opcoes[oi]);
      } else {
        div.innerHTML = head + `<textarea data-q="${i}" placeholder="Sua resposta"></textarea>`;
      }
      div.querySelector(".enun").textContent = q.enunciado;
      elQ.appendChild(div);
    });
  }

  btn.onclick = () => {
    if (!teste) return;
    const respostas = teste.questoes.map((q, i) => {
      if (q.tipo === "objetiva"){
        const sel = elQ.querySelector(`input[name="q${i}"]:checked`);
        return sel ? Number(sel.value) : null;
      }
      const ta = elQ.querySelector(`textarea[data-q="${i}"]`);
      return ta ? ta.value.trim() : "";
    });
    const faltam = respostas.filter((r) => r === null || r === "").length;
    if (faltam > 0){ dica.textContent = `Responda todas: faltam ${faltam}.`; return; }
    window.aulacerta.responder({ testeId: teste.id, respostas });
    document.getElementById("prova").style.display = "none";
    document.getElementById("feito").classList.add("show");
  };
</script>
</body>
</html>
