<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>AulaCerta</title>
<style>
  :root{
    --bg:#070c18; --surface:#0f1a30; --surface-2:#13223c; --line:#1d2d4d; --line-strong:#273b63;
    --ink:#eaf0fb; --muted:#8ea3c8; --faint:#5e7199; --red:#e23140; --red-bright:#ff4d5e; --red-deep:#8f1420; --azure:#4f9bff; --azure-soft:#2b4e86;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    font:15px/1.45 "Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:radial-gradient(900px 520px at 50% -10%, #0d1830, transparent 60%), var(--bg);
    user-select:none;
  }
  ::selection{ background:var(--red); color:#fff; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .mark{ width:38px; height:38px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(145deg,var(--red),var(--red-deep)); box-shadow:0 6px 16px -6px var(--red-deep), inset 0 1px 0 rgba(255,255,255,.22); }
  .mark svg{ width:21px; height:21px; }
  h1{ margin:0; font-size:23px; font-weight:700; letter-spacing:-.025em; }
  h1 b{ color:var(--red-bright); }
  .tagline{ color:var(--muted); font-size:13px; margin-top:-10px; }
  input::placeholder{ color:var(--muted); opacity:1; }
  .cards{ display:flex; gap:14px; }
  .card{
    width:172px; padding:20px 18px; border-radius:14px; cursor:pointer; text-align:left;
    background:linear-gradient(180deg,var(--surface-2),var(--surface)); border:1px solid var(--line);
    color:var(--ink); transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .card:hover{ border-color:var(--red-deep); transform:translateY(-2px); box-shadow:0 14px 30px -20px #000; }
  .card:focus-visible{ outline:none; border-color:var(--red); box-shadow:0 0 0 3px rgba(226,49,64,.25); }
  .card .ic{ width:26px; height:26px; color:var(--azure); margin-bottom:12px; }
  .card.prof .ic{ color:var(--red-bright); }
  .card h2{ margin:0 0 4px; font-size:16px; font-weight:650; letter-spacing:-.01em; }
  .card p{ margin:0; color:var(--muted); font-size:12.5px; }
  form{ display:none; flex-direction:column; gap:12px; width:360px; }
  form.show{ display:flex; }
  label{ font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:5px; }
  input{
    font:14px "Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:var(--bg); border:1px solid var(--line-strong); border-radius:9px; padding:10px 12px;
  }
  input:focus{ outline:none; border-color:var(--azure); box-shadow:0 0 0 3px rgba(79,155,255,.18); }
  .acoes{ display:flex; gap:10px; margin-top:4px; }
  button{
    font:14px/1 "Segoe UI",system-ui,sans-serif; font-weight:650; cursor:pointer;
    border-radius:9px; padding:11px 16px; border:1px solid transparent;
  }
  .primario{ background:linear-gradient(180deg,#c41d2b,var(--red-deep)); color:#fff; box-shadow:0 8px 18px -10px var(--red-deep); flex:1; }
  .primario:hover{ filter:brightness(1.07); }
  .voltar{ background:transparent; color:var(--muted); border-color:var(--line-strong); }
  .voltar:hover{ color:var(--ink); border-color:var(--azure-soft); }
</style>
</head>
<body>
  <div class="brand">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 6.5 12 3l9 3.5-9 3.5-9-3.5Z" fill="#fff" fill-opacity=".95"/><path d="M7 11.2V15c0 1.7 2.24 3 5 3s5-1.3 5-3v-3.8" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-opacity=".85"/></svg></span>
    <div><h1>Aula<b>Certa</b></h1></div>
  </div>
  <div class="tagline">Gestão de sala de aula · rede local</div>

  <div class="cards" id="cards">
    <button class="card prof" id="card-prof">
      <svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H4z" stroke="currentColor" stroke-width="1.6"/><path d="M9 20h6M12 16v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <h2>Sou o professor</h2>
      <p>Inicia a sala e abre o painel de controle.</p>
    </button>
    <button class="card aluno" id="card-aluno">
      <svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 19c0-3.3 3.1-5 7-5s7 1.7 7 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <h2>Sou aluno</h2>
      <p>Conecta ao computador do professor.</p>
    </button>
  </div>

  <form id="form-aluno">
    <label>IP da sala (do professor)
      <input id="ip" inputmode="decimal" placeholder="ex.: 192.168.1.18" autocomplete="off" />
    </label>
    <label>Seu nome
      <input id="nome" placeholder="ex.: Ana Ribeiro" autocomplete="off" />
    </label>
    <div class="acoes">
      <button type="button" class="voltar" id="voltar">Voltar</button>
      <button type="submit" class="primario">Conectar</button>
    </div>
  </form>

<script>
  const cards = document.getElementById("cards");
  const form = document.getElementById("form-aluno");
  const ip = document.getElementById("ip");
  const nome = document.getElementById("nome");

  document.getElementById("card-prof").onclick = () => window.aulacerta.escolher({ papel: "professor" });
  document.getElementById("card-aluno").onclick = () => { cards.style.display = "none"; form.classList.add("show"); ip.focus(); };
  document.getElementById("voltar").onclick = () => { form.classList.remove("show"); cards.style.display = "flex"; };

  form.onsubmit = (e) => {
    e.preventDefault();
    const host = ip.value.trim();
    if (!host) { ip.focus(); return; }
    const url = `ws://${host}:4571`;
    window.aulacerta.escolher({ papel: "aluno", url, nome: nome.value.trim() || "Aluno" });
  };

  // Lancado com --aluno abre direto no formulario.
  if (new URLSearchParams(location.search).get("papel") === "aluno") {
    cards.style.display = "none"; form.classList.add("show");
  }
</script>
</body>
</html>
