<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>AulaCerta — Configuração</title>
<style>
  :root{ --bg:#ffffff; --surface:#ffffff; --surface-2:#f7f8fa; --line:#e5e8ec; --line-strong:#d2d7de; --ink:#191c21; --muted:#5a6472; --faint:#949cac; --red:#d81f2a; --red-deep:#9e1620; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:28px;
    font:15px/1.45 "Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:radial-gradient(900px 520px at 50% -12%, #fdeef0, transparent 60%), #ffffff; user-select:none; }
  ::selection{ background:var(--red); color:#fff; }
  h1{ margin:0; font-size:21px; font-weight:700; letter-spacing:-.025em; } h1 b{ color:var(--red); }
  .sub{ margin:-8px 0 2px; color:var(--muted); font-size:13px; text-align:center; max-width:420px; }
  .cards{ display:flex; gap:14px; }
  .card{ width:188px; padding:18px; cursor:pointer; text-align:left; background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink); transition:border-color .14s, background .14s; }
  .card:hover{ border-color:var(--red); }
  .card[aria-pressed="true"]{ border-color:var(--red); background:#fdecef; box-shadow:inset 0 0 0 1px var(--red); }
  .card .ic{ width:26px; height:26px; color:var(--red); margin-bottom:10px; }
  .card h2{ margin:0 0 4px; font-size:15.5px; font-weight:650; }
  .card p{ margin:0; color:var(--muted); font-size:12.5px; }
  form{ display:none; flex-direction:column; gap:11px; width:380px; }
  form.show{ display:flex; }
  label{ font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:5px; }
  input{ font:14px "Segoe UI",system-ui,sans-serif; color:var(--ink); background:#fff; border:1px solid var(--line-strong); padding:10px 12px; }
  input:focus{ outline:none; border-color:var(--red); box-shadow:0 0 0 3px rgba(216,31,42,.15); }
  .aviso{ font-size:12px; color:var(--red-deep); background:#fdecee; border:1px solid #f2bcc1; padding:9px 11px; }
  .acoes{ display:flex; gap:10px; align-items:center; margin-top:4px; }
  button.primario{ font:14px/1 "Segoe UI",system-ui,sans-serif; font-weight:650; cursor:pointer; padding:11px 18px; border:1px solid var(--red-deep); background:var(--red); color:#fff; }
  button.primario:hover{ background:var(--red-deep); }
  button.voltar{ font:14px/1 "Segoe UI",system-ui,sans-serif; font-weight:600; cursor:pointer; padding:11px 14px; border:1px solid var(--line-strong); background:transparent; color:var(--muted); }
  .err{ color:var(--red-deep); font-size:12.5px; min-height:16px; }
</style>
</head>
<body>
  <h1>Aula<b>Certa</b> — Configuração</h1>
  <p class="sub">Escolha o papel deste computador. <b>Esta escolha é definitiva no app</b> —
    não há como trocar o papel depois (para reconfigurar, reinstale o programa).</p>

  <div class="cards" id="cards">
    <button class="card" id="c-prof" aria-pressed="false">
      <svg class="ic" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H4z" stroke="currentColor" stroke-width="1.6"/><path d="M9 20h6M12 16v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <h2>Administrador (Professor)</h2>
      <p>Hospeda a sala e controla a turma. Protegido por senha.</p>
    </button>
    <button class="card" id="c-aluno" aria-pressed="false">
      <svg class="ic" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"/><path d="M5 19c0-3.3 3.1-5 7-5s7 1.7 7 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <h2>Aluno</h2>
      <p>Conecta ao professor na rede local.</p>
    </button>
  </div>

  <form id="form">
    <div id="campos-senha">
      <label>Senha do professor (mín. 4 caracteres)
        <input id="s1" type="password" autocomplete="off" />
      </label>
      <label style="margin-top:11px">Confirme a senha
        <input id="s2" type="password" autocomplete="off" />
      </label>
    </div>
    <p class="aviso" id="aviso-papel"></p>
    <span class="err" id="err"></span>
    <div class="acoes">
      <button type="button" class="voltar" id="voltar">Voltar</button>
      <button type="submit" class="primario">Concluir configuração</button>
    </div>
  </form>

<script>
  const cards = document.getElementById("cards");
  const form = document.getElementById("form");
  const cProf = document.getElementById("c-prof");
  const cAluno = document.getElementById("c-aluno");
  const camposSenha = document.getElementById("campos-senha");
  const aviso = document.getElementById("aviso-papel");
  const s1 = document.getElementById("s1");
  const s2 = document.getElementById("s2");
  const err = document.getElementById("err");
  let papel = null;

  window.aulacerta.onSetupErro((m) => { err.textContent = m || "Erro."; });

  function escolher(p){
    papel = p;
    cProf.setAttribute("aria-pressed", String(p === "professor"));
    cAluno.setAttribute("aria-pressed", String(p === "aluno"));
    cards.style.display = "none";
    form.classList.add("show");
    camposSenha.style.display = p === "professor" ? "block" : "none";
    aviso.textContent = p === "professor"
      ? "Este computador será o ADMINISTRADOR (professor). Definitivo no app."
      : "Este computador será ALUNO. Definitivo no app.";
    if (p === "professor") s1.focus();
  }
  cProf.onclick = () => escolher("professor");
  cAluno.onclick = () => escolher("aluno");
  document.getElementById("voltar").onclick = () => { form.classList.remove("show"); cards.style.display = "flex"; err.textContent = ""; };

  form.onsubmit = (e) => {
    e.preventDefault();
    err.textContent = "";
    if (papel === "professor"){
      if (s1.value.length < 4){ err.textContent = "A senha precisa de ao menos 4 caracteres."; return; }
      if (s1.value !== s2.value){ err.textContent = "As senhas não conferem."; return; }
      window.aulacerta.setupConcluir({ papel, senha: s1.value });
    } else if (papel === "aluno"){
      window.aulacerta.setupConcluir({ papel });
    }
  };
</script>
</body>
</html>
