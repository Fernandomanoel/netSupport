<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>AulaCerta — Aluno</title>
<style>
  :root{ --bg:#ffffff; --surface:#ffffff; --line:#e5e8ec; --ink:#191c21; --muted:#5a6472; --faint:#949cac; --red:#d81f2a; --red-deep:#9e1620; --azure:#d81f2a; }
  *{ box-sizing:border-box; }
  body{ margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:24px;
    font:15px/1.5 "Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:radial-gradient(800px 460px at 50% -12%, #fdeef0, transparent 60%), #ffffff; user-select:none; }
  .mark{ width:40px; height:40px; border-radius:0; display:grid; place-items:center; background:linear-gradient(145deg,var(--red),var(--red-deep)); box-shadow:inset 0 1px 0 rgba(255,255,255,.22); }
  .mark svg{ width:22px; height:22px; }
  .conn{ display:inline-flex; align-items:center; gap:9px; font-size:14px; font-weight:650; color:#9e1620; padding:7px 14px; border:1px solid #f2bcc1; border-radius:0; background:#fdecef; }
  .conn .d{ width:8px; height:8px; border-radius:50%; background:var(--red); }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(216,31,42,.45);} 70%{ box-shadow:0 0 0 7px rgba(216,31,42,0);} 100%{ box-shadow:0 0 0 0 rgba(216,31,42,0);} }
  h1{ margin:4px 0 0; font-size:18px; font-weight:700; letter-spacing:-.02em; }
  .det{ color:var(--muted); font-size:13.5px; font-variant-numeric:tabular-nums; }
  .nota{ color:var(--muted); font-size:12.5px; max-width:320px; }
  .ajuda{ margin-top:6px; font:14px/1 "Segoe UI",system-ui,sans-serif; font-weight:650; cursor:pointer; padding:11px 18px; border:1px solid var(--red-deep); background:#fff; color:var(--red-deep); }
  .ajuda:hover{ background:#fdecef; }
  .ajuda.on{ background:var(--red); color:#fff; }
</style>
</head>
<body>
  <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 6.5 12 3l9 3.5-9 3.5-9-3.5Z" fill="#fff" fill-opacity=".95"/><path d="M7 11.2V15c0 1.7 2.24 3 5 3s5-1.3 5-3v-3.8" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-opacity=".85"/></svg></span>
  <span class="conn"><span class="d"></span>Conectado à sala</span>
  <h1 id="nome">Aluno</h1>
  <div class="det" id="url">—</div>
  <p class="nota">Durante a aula, o professor acompanha uma miniatura desta tela e pode bloqueá-la. Você verá um aviso em tela cheia quando ela for bloqueada.</p>
  <button id="ajuda" class="ajuda">✋ Pedir ajuda</button>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("nome").textContent = q.get("nome") || "Aluno";
  document.getElementById("url").textContent = q.get("url") || "";
  const bAjuda = document.getElementById("ajuda");
  let pedindo = false;
  bAjuda.onclick = () => {
    pedindo = !pedindo;
    bAjuda.classList.toggle("on", pedindo);
    bAjuda.textContent = pedindo ? "✋ Ajuda solicitada — cancelar" : "✋ Pedir ajuda";
    window.aulacerta.alunoAjuda(pedindo);
  };
</script>
</body>
</html>
